name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    uses: adriangalilea/ci/.github/workflows/node.yml@aff0340f6067ae0013ad2304c3c1bb591d64ceb6 # v1.2.1
    permissions:
      contents: read

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish
        run: |
          # ./ is load-bearing: npm reads `dist/x.tgz` as the GitHub repo dist/x.tgz.
          TGZ=$(echo ./dist/*.tgz)
          NAME=$(tar -xOzf "$TGZ" package/package.json | jq -r .name)
          VERSION=$(tar -xOzf "$TGZ" package/package.json | jq -r .version)
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm"
          else
            npm publish "$TGZ" --access public
          fi

  release:
    needs: [build, publish]
    uses: adriangalilea/ci/.github/workflows/release.yml@aff0340f6067ae0013ad2304c3c1bb591d64ceb6 # v1.2.1
    with:
      tag: ${{ needs.build.outputs.tag }}
    permissions:
      contents: write
