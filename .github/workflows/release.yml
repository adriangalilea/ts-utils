name: release

# One chain per package (build, publish, release), each with its own gate,
# tarball artifact, tag line and notes, and none waiting on another, so one
# package's failure never holds back the rest. A package publishes when its
# version has no GitHub release yet, so bumping one package releases only that one.
# npm trusted publishing names this file and the `npm` environment, so every
# publish job lives here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-utils:
    uses: adriangalilea/ci/.github/workflows/node.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      directory: packages/utils
      verify: verify:utils
      artifact: utils
    permissions:
      contents: read

  publish-utils:
    needs: build-utils
    if: needs.build-utils.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: adriangalilea/ci/.github/actions/npm-publish@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
        with:
          artifact: utils

  release-utils:
    needs: [build-utils, publish-utils]
    uses: adriangalilea/ci/.github/workflows/release.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      tag: ${{ needs.build-utils.outputs.tag }}
      paths: packages/utils/**
    permissions:
      contents: write

  build-llm:
    uses: adriangalilea/ci/.github/workflows/node.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      directory: packages/llm
      tag-prefix: llm-
      verify: verify:llm
      artifact: llm
    permissions:
      contents: read

  publish-llm:
    needs: build-llm
    if: needs.build-llm.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: adriangalilea/ci/.github/actions/npm-publish@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
        with:
          artifact: llm

  release-llm:
    needs: [build-llm, publish-llm]
    uses: adriangalilea/ci/.github/workflows/release.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      tag: ${{ needs.build-llm.outputs.tag }}
      tag-prefix: llm-
      paths: packages/llm/**
    permissions:
      contents: write

  build-bot:
    uses: adriangalilea/ci/.github/workflows/node.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      directory: packages/bot
      tag-prefix: bot-
      verify: verify:bot
      artifact: bot
    permissions:
      contents: read

  publish-bot:
    needs: build-bot
    if: needs.build-bot.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: adriangalilea/ci/.github/actions/npm-publish@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
        with:
          artifact: bot

  release-bot:
    needs: [build-bot, publish-bot]
    uses: adriangalilea/ci/.github/workflows/release.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      tag: ${{ needs.build-bot.outputs.tag }}
      tag-prefix: bot-
      paths: packages/bot/**
    permissions:
      contents: write

  build-metrics:
    uses: adriangalilea/ci/.github/workflows/node.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      directory: packages/metrics
      tag-prefix: metrics-
      verify: verify:metrics
      artifact: metrics
    permissions:
      contents: read

  publish-metrics:
    needs: build-metrics
    if: needs.build-metrics.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: adriangalilea/ci/.github/actions/npm-publish@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
        with:
          artifact: metrics

  release-metrics:
    needs: [build-metrics, publish-metrics]
    uses: adriangalilea/ci/.github/workflows/release.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      tag: ${{ needs.build-metrics.outputs.tag }}
      tag-prefix: metrics-
      paths: packages/metrics/**
    permissions:
      contents: write
