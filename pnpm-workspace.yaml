# One repo, one package per audience: utils (the core every program uses),
# llm, bot, metrics. Each has its own version and npm name; inside the repo
# they reach each other through workspace:^ and read each other's src via the
# adriangalilea-source export condition, so no build stands between an edit
# and a test.
packages:
  - packages/*

allowBuilds:
  esbuild: false

# Local override of the GLOBAL supply-chain age gate (7d, strict): the gramio
# family ships Bot API features the bots need same-week (10.3 disabled buttons).
# Overriding replaces the global list, so @adriangalilea/* rides along.
minimumReleaseAgeExclude:
  - "@adriangalilea/*"
  - gramio
  - "@gramio/*"
