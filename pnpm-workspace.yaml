allowBuilds:
  esbuild: false

# Local override of the GLOBAL supply-chain age gate (7d, strict): the gramio
# family ships Bot API features the bots need same-week (10.3 disabled buttons).
# Overriding replaces the global list, so @adriangalilea/* rides along.
minimumReleaseAgeExclude:
  - "@adriangalilea/*"
  - gramio
  - "@gramio/*"
